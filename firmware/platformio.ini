; TinyBuddy firmware — milestone 1 (face candidates + animation #80 on real hardware)
;
;   pio run -e sh1106            build for a 1.3" SH1106 module (most 1.3" boards)
;   pio run -e ssd1306           build for an SSD1306 module (most 0.96" boards)
;   pio run -e sh1106 -t upload  flash, then: pio device monitor
;   pio run -e wokwi             build for the Wokwi simulator (SSD1306, UART serial)
;
; The controller can also be switched at runtime with the serial command
; `display sh1106|ssd1306` (saved to flash), so a wrong guess never needs a rebuild.

[platformio]
default_envs = sh1106

[env]
platform = espressif32@6.13.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
  symlink://../core
  olikraus/U8g2@2.36.2
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -Wall
  -DTB_SDA=8
  -DTB_SCL=9
  -DTB_I2C_ADDR=0x3C
  -DTB_I2C_HZ=400000

; ESP32-C3 Super Mini: serial goes over the chip's native USB (no USB-UART bridge)
[env:sh1106]
build_flags =
  ${env.build_flags}
  -DTB_DEFAULT_CONTROLLER=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:ssd1306]
build_flags =
  ${env.build_flags}
  -DTB_DEFAULT_CONTROLLER=0
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; Wokwi's ESP32-C3-DevKitM-1 + SSD1306 part; serial on UART0 (TX/RX) to the Wokwi monitor
[env:wokwi]
build_flags =
  ${env.build_flags}
  -DTB_DEFAULT_CONTROLLER=0
  -DTB_WOKWI=1
  -DARDUINO_USB_CDC_ON_BOOT=0
